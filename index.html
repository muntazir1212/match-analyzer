<!DOCTYPE html><html lang="ar" dir="rtl"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1"><title>محلل المباريات</title>
<style>
:root{--bg:#f4f6f9;--cd:#fff;--tx:#10151c;--mu:#667085;--bd:#dde2ea;--ac:#1a6dff;--ok:#12805c;--wn:#b54708;--er:#c0262d}
@media(prefers-color-scheme:dark){:root{--bg:#0d1117;--cd:#161c26;--tx:#e8ecf2;--mu:#8b96a8;--bd:#262f3d;--ac:#4d90ff;--ok:#3ccf9a;--wn:#f0a04b;--er:#ff7b80}}
body{margin:0;background:var(--bg);color:var(--tx);font-family:system-ui,Tahoma,sans-serif;line-height:1.6}
main{max-width:560px;margin:0 auto;padding:16px}h1{font-size:1.4rem;margin:8px 0}
.c{background:var(--cd);border:1px solid var(--bd);border-radius:14px;padding:14px;margin-bottom:12px}
.d{display:block;border:2px dashed var(--bd);border-radius:12px;padding:22px;text-align:center;color:var(--mu);cursor:pointer}
.d img{max-width:100%;max-height:260px;border-radius:8px}input{display:none}
button{width:100%;margin-top:12px;padding:13px;border:0;border-radius:12px;background:var(--ac);color:#fff;font-size:1rem;font-weight:600}
button:disabled{opacity:.5}.r{display:flex;justify-content:space-between;gap:8px;align-items:center}
.t{padding:2px 10px;border-radius:99px;font-size:.78rem;font-weight:600;border:1px solid var(--bd)}
.ok{color:var(--ok)}.wn{color:var(--wn)}.er{color:var(--er)}.m{color:var(--mu);font-size:.85rem}h2{font-size:1rem;margin:0 0 8px}
#gk,#fk{display:block;width:100%;box-sizing:border-box;margin-top:8px;padding:10px;border:1px solid var(--bd);border-radius:10px;background:var(--bg);color:var(--tx)}summary{cursor:pointer;font-weight:600}#sv{margin-top:10px;padding:10px}</style></head><body><main><h1>محلل المباريات</h1>
<details class="c"><summary>⚙️ المفاتيح (تنحفظ بجهازك فقط)</summary>
<input id="gk" type="password" placeholder="مفتاح OpenRouter"><input id="fk" type="password" placeholder="مفتاح API-Football">
<button id="sv">حفظ</button><div class="m" id="ks"></div></details>
<div class="c"><label class="d"><span id="h">اضغط لرفع صورة المباراة 📸</span><input type="file" id="f" accept="image/*"></label>
<button id="go" disabled>حلّل</button></div><div id="out"></div></main>
<script>
// Match Analyzer - Cloudflare Worker
// Secrets required: OR_KEY, FOOTBALL_KEY

async function tfetch(url, opts, ms) {
  const c = new AbortController();
  const t = setTimeout(() => c.abort(), ms || 90000);
  try { return await fetch(url, { ...opts, signal: c.signal }); }
  catch (e) { throw new Error(e.name === "AbortError" ? "انتهت المهلة: " + url.split("/")[2] : e.message); }
  finally { clearTimeout(t); }
}

async function llm(env, parts) {
  const content = parts.map((p) =>
    p.text != null
      ? { type: "text", text: p.text }
      : { type: "image_url", image_url: { url: "data:" + p.inline_data.mime_type + ";base64," + p.inline_data.data } }
  );
  const r = await tfetch("https://openrouter.ai/api/v1/chat/completions", {
    method: "POST",
    headers: { "Content-Type": "application/json", Authorization: "Bearer " + env.OR_KEY },
    body: JSON.stringify({ model: "openrouter/free", messages: [{ role: "user", content }], temperature: 0.2, max_tokens: 2000 }),
  }, 90000);
  const j = await r.json();
  if (!r.ok) throw new Error("OpenRouter: " + ((j.error && j.error.message) || r.status));
  const t = (j.choices && j.choices[0] && j.choices[0].message && j.choices[0].message.content) || "";
  const a = t.indexOf("{"), b = t.lastIndexOf("}");
  if (a < 0 || b < 0) throw new Error("الموديل ما رجّع نتيجة مفهومة، حاول مرة ثانية");
  try { return JSON.parse(t.slice(a, b + 1)); }
  catch (e) { throw new Error("الموديل رجّع نتيجة غير صالحة، حاول مرة ثانية"); }
}

async function fb(env, path, retry = true) {
  const r = await tfetch("https://v3.football.api-sports.io" + path, {
    headers: { "x-apisports-key": env.FOOTBALL_KEY },
  });
  const j = await r.json();
  const e = j.errors;
  if (e && (Array.isArray(e) ? e.length : Object.keys(e).length)) {
    if (retry && JSON.stringify(e).toLowerCase().includes("rate")) {
      await new Promise((ok) => setTimeout(ok, 7000));
      return fb(env, path, false);
    }
    return { error: JSON.stringify(e) };
  }
  return { data: j.response || [] };
}

async function teamId(env, name) {
  if (!name) return null;
  let r = await fb(env, "/teams?search=" + encodeURIComponent(name));
  if (r.error) return { error: r.error };
  if (!r.data.length) {
    const first = name.split(" ").find((w) => w.length > 3);
    if (first) r = await fb(env, "/teams?search=" + encodeURIComponent(first));
    if (r.error) return { error: r.error };
  }
  return r.data.length ? { id: r.data[0].team.id } : null;
}

function sumFix(list, id) {
  const s = { n: 0, w: 0, d: 0, l: 0, gf: 0, ga: 0, over25: 0, btts: 0, results: [] };
  for (const f of list) {
    const g = f.goals;
    if (g.home == null) continue;
    const home = f.teams.home.id === id;
    const a = home ? g.home : g.away;
    const b = home ? g.away : g.home;
    s.n++; s.gf += a; s.ga += b;
    if (a > b) s.w++; else if (a < b) s.l++; else s.d++;
    if (a + b >= 3) s.over25++;
    if (a > 0 && b > 0) s.btts++;
    s.results.push(a + "-" + b);
  }
  return s;
}

const STATS_N = 3; // عدد المباريات الأخيرة لكل فريق لحساب الركنيات والبطاقات

async function matchStats(env, fixtureId) {
  const r = await fb(env, "/fixtures/statistics?fixture=" + fixtureId);
  if (r.error || !r.data.length) return null;
  const get = (type) => {
    const o = {};
    for (const e of r.data) {
      const x = (e.statistics || []).find((v) => v.type === type);
      o[e.team.id] = x && x.value != null ? Number(x.value) : null;
    }
    return o;
  };
  return { corners: get("Corner Kicks"), yellow: get("Yellow Cards") };
}

async function teamExtra(env, list, id) {
  const last = list.slice().sort((p, q) => new Date(q.fixture.date) - new Date(p.fixture.date)).slice(0, STATS_N);
  const acc = { m: 0, cf: 0, ct: 0, yf: 0, yt: 0 };
  for (const f of last) {
    const m = await matchStats(env, f.fixture.id);
    if (!m) continue;
    const cv = Object.values(m.corners), yv = Object.values(m.yellow);
    if (cv.some((v) => v == null) || yv.some((v) => v == null)) continue;
    acc.m++;
    acc.cf += m.corners[id]; acc.ct += cv.reduce((x, y) => x + y, 0);
    acc.yf += m.yellow[id]; acc.yt += yv.reduce((x, y) => x + y, 0);
  }
  if (!acc.m) return null;
  const av = (v) => Math.round((v / acc.m) * 10) / 10;
  return { matches: acc.m, corners_team_avg: av(acc.cf), corners_total_avg: av(acc.ct), yellow_team_avg: av(acc.yf), yellow_total_avg: av(acc.yt) };
}

async function apiData(env, home, away) {
  const out = { used: false, notes: [] };
  if (!env.FOOTBALL_KEY) { out.notes.push("no football key"); return out; }
  const h = await teamId(env, home);
  const a = await teamId(env, away);
  if ((h && h.error) || (a && a.error)) { out.notes.push((h && h.error) || (a && a.error)); return out; }
  if (!h || !a) { out.notes.push("team not found in API"); return out; }
  const fh = await fb(env, "/fixtures?team=" + h.id + "&last=5");
  const fa = await fb(env, "/fixtures?team=" + a.id + "&last=5");
  const hh = await fb(env, "/fixtures/headtohead?h2h=" + h.id + "-" + a.id + "&last=5");
  if (!fh.error && fh.data.length) { out.home_last5 = sumFix(fh.data, h.id); out.home_extra = await teamExtra(env, fh.data, h.id); out.used = true; } else if (fh.error) out.notes.push(fh.error);
  if (!fa.error && fa.data.length) { out.away_last5 = sumFix(fa.data, a.id); out.away_extra = await teamExtra(env, fa.data, a.id); out.used = true; } else if (fa.error) out.notes.push(fa.error);
  if (!hh.error && hh.data.length) { out.h2h = sumFix(hh.data, h.id); out.used = true; }
  return out;
}

const EXTRACT = `You read a football match screenshot (any language). Use ONLY what is visible. Never guess.
Return JSON only:
{"readable":bool,"match_count":int,"status":"not_started|live|finished|postponed|unknown","minute":string|null,
"home_ar":string,"away_ar":string,"home_en":"team name in English letters","away_en":"team name in English letters",
"competition":string|null,"score":{"home":int|null,"away":int|null},
"odds":{"home":number|null,"draw":number|null,"away":number|null},
"stats":[{"label":string,"home":string,"away":string}],
"form":{"home":[string],"away":[string]}|null,
"events":[string]}
In stats include corners and yellow cards if shown. Odds may use Arabic digits or a decimal comma: convert to normal numbers. The home team is the "host" side.`;

const ANALYZE = `أنت محلل مباريات. عندك معطيات من صورة المباراة ومن API رياضي (إن وجدت). اعتمد عليها فقط ولا تخمّن.
أجب JSON فقط:
{"summary":"شرح مختصر للمباراة بجملتين بالعربية البسيطة","picks":{"goals":{"pick":"التوقع","conf":"high|medium|low","why":"سبب قصير فيه رقم"},"corners":{"pick":"التوقع","conf":"high|medium|low","why":"سبب قصير فيه رقم"},"cards":{"pick":"التوقع","conf":"high|medium|low","why":"سبب قصير فيه رقم"}}}
قواعد:
- لكل سوق توقع واحد فقط هو الأقوى: الأهداف (أكثر أو أقل من خط مثل 0.5 أو 1.5 أو 2.5 أو 3.5، أو كلا الفريقين يسجل)، الركنيات (أكثر أو أقل من خط للمجموع)، البطاقات الصفراء (أكثر أو أقل من خط للمجموع).
- اعتمد على متوسطات API (أهداف وركنيات وبطاقات آخر المباريات والمواجهات المباشرة) وعلى إحصائيات الصورة.
- إذا المباراة لايف فاحسب النتيجة والدقيقة وما تحقق من ركنيات وبطاقات حتى الآن.
- إذا العينة صغيرة أو ناقصة فخفّض الثقة، وإذا لا توجد معطيات للسوق فاجعل pick=null.
- لا نصيحة رهان ولا مبالغ.`;

async function analyze(env, b64) {
  if (!env.OR_KEY) throw new Error("أدخل مفتاح OpenRouter من قسم المفاتيح");
  if (typeof progress === "function") progress("1/3 قراءة الصورة...");
  const x = await llm(env, [
    { text: EXTRACT },
    { inline_data: { mime_type: "image/jpeg", data: b64 } },
  ]);
  if (!x.readable) return { refuse: "الصورة غير واضحة، ارفع لقطة أوضح." };
  if (x.match_count > 1) return { refuse: "الصورة فيها أكثر من مباراة، ارفع صورة لمباراة واحدة." };
  if (x.status === "postponed") return { refuse: "المباراة مؤجلة أو ملغاة." };

  if (typeof progress === "function") progress("2/3 جلب البيانات...");
  let api;
  try { api = await apiData(env, x.home_en, x.away_en); }
  catch (e) { api = { used: false, notes: [String(e.message || e)] }; }
  if (typeof progress === "function") progress("3/3 كتابة التحليل...");
  const r = await llm(env, [
    { text: ANALYZE + "\n\nمعطيات الصورة:\n" + JSON.stringify(x) + "\n\nمعطيات API:\n" + JSON.stringify(api) },
  ]);
  return {
    home: x.home_ar, away: x.away_ar, competition: x.competition, status: x.status,
    minute: x.minute, score: x.score, summary: r.summary, picks: r.picks,
    source: api.used ? "الصورة + API" : "الصورة فقط",
    apiNote: api.used ? "" : (api.notes || []).join(" | ").slice(0, 200),
  };
}

function progress(t){var b=document.getElementById("go");if(b)b.textContent=t}
function getEnv(){try{return{OR_KEY:localStorage.getItem("ork")||window._ork||"",FOOTBALL_KEY:localStorage.getItem("fk")||window._fk||""}}catch(e){return{OR_KEY:window._ork||"",FOOTBALL_KEY:window._fk||""}}}
var $=function(i){return document.getElementById(i)},img=null;
function esc(s){var d=document.createElement("div");d.textContent=s==null?"":String(s);return d.innerHTML}
function card(h){var d=document.createElement("div");d.className="c";d.innerHTML=h;$("out").appendChild(d)}
function shrink(file){return new Promise(function(res){var i=new Image();i.onload=function(){var s=Math.min(1,900/i.width),c=document.createElement("canvas");c.width=i.width*s;c.height=i.height*s;c.getContext("2d").drawImage(i,0,0,c.width,c.height);var u=c.toDataURL("image/jpeg",.8);res({url:u,b64:u.split(",")[1]})};i.src=URL.createObjectURL(file)})}
$("f").onchange=async function(e){var f=e.target.files[0];if(!f)return;img=await shrink(f);$("h").innerHTML='<img src="'+img.url+'">';$("go").disabled=false;$("out").innerHTML="";e.target.value=""};
$("sv").onclick=function(){var g=$("gk").value.trim(),f=$("fk").value.trim();try{if(g)localStorage.setItem("ork",g);if(f)localStorage.setItem("fk",f)}catch(e){if(g)window._ork=g;if(f)window._fk=f}$("gk").value="";$("fk").value="";$("ks").textContent="تم الحفظ ✓"};
$("go").onclick=async function(){
  $("out").innerHTML="";$("go").disabled=true;$("go").textContent="جاري التحليل...";
  try{
    var j=await analyze(getEnv(),img.b64);
    if(j.error){card('<b class="er">'+esc(j.error)+'</b>');return}
    if(j.refuse){card('<b class="wn">'+esc(j.refuse)+'</b>');return}
    var st={not_started:"لم تبدأ",live:"لايف",finished:"منتهية"}[j.status]||"";
    var sc=(j.score&&j.score.home!=null)?" · "+j.score.home+" - "+j.score.away:"";
    card('<div class="r"><b>'+esc(j.home)+' ⚔ '+esc(j.away)+'</b><span class="t">'+st+(j.minute?" · "+esc(j.minute):"")+sc+'</span></div><div class="m">'+esc(j.competition||"")+'</div>');
    card("<h2>شرح المباراة</h2><div>"+esc(j.summary)+"</div>");
    var T=[["goals","⚽ الأهداف"],["corners","🚩 الركنيات"],["cards","🟨 البطاقات الصفراء"]],cm={high:["عالية","ok"],medium:["متوسطة","wn"],low:["منخفضة","er"]};
    T.forEach(function(t){var p=j.picks&&j.picks[t[0]];
      if(p&&p.pick){var c=cm[p.conf]||cm.low;card('<h2>'+t[1]+'</h2><div class="r"><b style="font-size:1.2rem">'+esc(p.pick)+'</b><span class="t '+c[1]+'">ثقة '+c[0]+'</span></div><div class="m" style="margin-top:6px">'+esc(p.why)+'</div>')}
      else card('<h2>'+t[1]+'</h2><div class="m">ما فيه معطيات تكفي لتوقع.</div>')});
    card('<div class="m" style="font-size:.75rem">المصدر: '+esc(j.source)+' · تحليل وليس ضماناً.</div>');
    if(j.apiNote)card('<div class="m">ملاحظة API: '+esc(j.apiNote)+'</div>');
  }catch(e){card('<b class="er">صار خطأ: '+esc(e.message)+'</b>')}
  finally{$("go").disabled=false;$("go").textContent="حلّل"}
};
</script></body></html>
